name: patina
description: Gestione progetti di modellismo statico
publish_to: 'none'
version: 1.0.0-beta.1+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State management
  flutter_riverpod: ^2.5.1

  # Database locale
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24

  # Navigazione
  go_router: ^14.1.4

  # Immagini
  image_picker: ^1.1.2

  # OCR locale (scansione foglio istruzioni)
  google_mlkit_text_recognition: ^0.13.1

  # Permessi
  permission_handler: ^11.3.1

  # Font
  google_fonts: ^6.2.1

  # Preferenze utente (tema dark/light)
  shared_preferences: ^2.2.3

  # Condivisione nativa (iOS/Android share sheet)
  share_plus: ^10.0.3

  # Backup: compressione ZIP
  archive: ^3.6.1

  # Backup: selezione file ZIP per import
  file_picker: ^8.1.7

  # Percorsi file sistema (documenti, temp)
  path_provider: ^2.1.4

  # Utilità percorsi (p.join, p.basename, ecc.)
  path: ^1.9.0

  # ── Firebase + Auth ──────────────────────────────────────────────────────────
  # Richiede google-services.json in app/android/app/ (scaricabile da Firebase Console)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  cloud_functions: ^5.1.3

  # ── RevenueCat — abbonamenti in-app ──────────────────────────────────────────
  # Richiede API key RevenueCat (app.revenuecat.com → App settings → API keys)
  purchases_flutter: ^8.0.0

  # ── HTTP — chiamate Claude API tramite Firebase Functions ────────────────────
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Icona launcher
  flutter_launcher_icons: ^0.14.3

  # Codegen Drift
  build_runner: ^2.4.11
  drift_dev: ^2.18.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/catalogs/
    - assets/icon.png
