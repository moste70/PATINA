name: patina
description: Gestione progetti di modellismo statico
publish_to: 'none'
version: 1.0.0-beta.1+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # State management
  flutter_riverpod: ^2.5.1

  # Database locale
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24

  # Navigazione
  go_router: ^14.1.4

  # Immagini
  image_picker: ^1.1.2

  # Permessi
  permission_handler: ^11.3.1

  # Font
  google_fonts: ^6.2.1

  # Preferenze utente (tema dark/light)
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Icona launcher
  flutter_launcher_icons: ^0.14.3

  # Codegen Drift
  build_runner: ^2.4.11
  drift_dev: ^2.18.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/catalogs/
    - assets/icon.png
