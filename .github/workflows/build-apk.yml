name: Build APK

on:
  push:
    branches:
      - 'claude/**'
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/android/app/google-services.json

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Generate code (build_runner)
        working-directory: app
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: patina-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Build release APK
        working-directory: app
        continue-on-error: true
        run: flutter build apk --release

      - name: Find release APK
        id: find_apk
        run: |
          APK=$(find app -name "app-release.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find app -name "*.apk" 2>/dev/null | grep -v debug | grep -v unsigned | head -1)
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload release APK
        if: steps.find_apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: patina-release-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14
          if-no-files-found: warn
